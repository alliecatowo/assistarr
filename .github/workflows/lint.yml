name: CI

on:
  push:
    branches: [main, ui-improvements]
  pull_request:
    branches: [main]

env:
  # Test environment variables to skip production requirements
  VITEST: "true"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: pnpm install
      - name: Run lint
        run: pnpm lint

  build:
    name: Build
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: pnpm install
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next
          key: nextjs-build-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'app/**', 'components/**', 'lib/**') }}
          restore-keys: |
            nextjs-build-
      - name: Build
        run: pnpm build
        env:
          # Skip database migration in CI build
          SKIP_DB_MIGRATE: "true"

  test:
    name: Unit Tests
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: pnpm install
      - name: Run tests
        run: pnpm test -- --run --coverage
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  docker:
    name: Docker image
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build image
        run: docker build -t assistarr:ci .
