name: Visual Regression Tests

on:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate baseline screenshots (download them from the run artifacts)
        type: boolean
        default: false
  pull_request:
    branches: [main, master]
    paths:
      - "components/**"
      - ".ladle/**"
      - "app/globals.css"
      - "tests/visual/**"
      - "playwright.config.ts"
      - ".github/workflows/visual-tests.yml"

jobs:
  visual-test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Ladle
        run: pnpm ladle:build

      - name: Start Ladle Preview
        run: |
          pnpm ladle:preview &
          npx wait-on http://localhost:61000 --timeout 60000

      - name: Run Visual Tests
        run: pnpm test:visual --project=visual ${{ inputs.update_snapshots && '--update-snapshots' || '' }}
        env:
          PLAYWRIGHT_NO_WEBSERVER: "1"

      - name: Upload snapshot diffs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-test-diffs
          path: |
            tests/visual/snapshot.spec.ts-snapshots/
            test-results/
          retention-days: 7

      - name: Upload regenerated snapshots
        uses: actions/upload-artifact@v7
        if: always() && inputs.update_snapshots
        with:
          name: updated-snapshots
          path: tests/visual/snapshot.spec.ts-snapshots/
          retention-days: 7

      - name: Upload Ladle build
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ladle-build
          path: build-ladle/
          retention-days: 7
